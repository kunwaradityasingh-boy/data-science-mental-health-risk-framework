[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-framework-mental-health-risk"
version = "0.1.0"
description = "Privacy-aware multimodal data science framework for early mental health risk screening research."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]